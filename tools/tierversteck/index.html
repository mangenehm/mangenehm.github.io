<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4efe6">
  <meta name="description" content="Tierversteck – Schiffe versenken auf einer echten Karte: Tiere in der eigenen Nachbarschaft verstecken und gegenseitig suchen. Online zu zweit oder an einem Gerät.">
  <meta property="og:title" content="Tierversteck">
  <meta property="og:description" content="Versteck Schlange, Pferd, Hund, Katze und Maus auf einer echten Karte – und finde die Tiere deines Gegenübers.">
  <meta property="og:image" content="assets/hero.webp">
  <title>Tierversteck</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a class="brand" href="./" aria-label="Tierversteck – Start">
        <span class="mark" aria-hidden="true">🐾</span>
        <span class="title-text">Tierversteck</span>
      </a>
      <div class="top-actions">
        <span id="conn" class="conn" hidden><i></i><span></span></span>
        <button id="sound" class="icon-btn round" aria-pressed="true" aria-label="Ton und Ansagen" title="Ton und Ansagen">🔊</button>
        <button id="leave" class="icon-btn" hidden>Beenden</button>
      </div>
    </header>
    <main id="app" aria-live="polite">
      <noscript><p class="card">Tierversteck braucht JavaScript.</p></noscript>
    </main>
    <footer class="foot small muted">
      Kartendaten © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>-Mitwirkende ·
      Adresssuche: Nominatim · Verbindung: WebRTC (Trystero)
    </footer>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
