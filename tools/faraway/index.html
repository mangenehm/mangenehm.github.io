<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Faraway – Punktezähler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --night: #1b1040;
      --dusk: #45206e;
      --magenta: #b53471;
      --coral: #e8595c;
      --sunset: #f0932b;
      --gold: #f6c667;
      --cream: #fdf3e3;
      --cream-dark: #f0e0c4;
      --ink: #2c1530;
      --teal: #1d8a8a;
      --teal-deep: #11605f;
      --pad-gray: #d8d6d2;
      --pad-red: #d94f3d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100%; }

    body {
      font-family: 'Nunito', system-ui, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg,
        var(--night) 0%,
        var(--dusk) 22%,
        var(--magenta) 48%,
        var(--coral) 66%,
        var(--sunset) 85%,
        var(--gold) 100%);
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* ── decorative sky ── */
    .sky {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .sun {
      position: absolute;
      left: 50%;
      top: 38%;
      width: 340px; height: 340px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, #ffe9b0 0%, #f9c74f 35%, rgba(249,199,79,0.25) 62%, transparent 70%);
      opacity: 0.85;
    }
    .sun::after {
      content: '';
      position: absolute;
      inset: -60px;
      border-radius: 50%;
      background: repeating-conic-gradient(rgba(255,220,140,0.14) 0deg 6deg, transparent 6deg 18deg);
      animation: sunspin 90s linear infinite;
    }
    @keyframes sunspin { to { transform: rotate(360deg); } }
    .star {
      position: absolute;
      width: 4px; height: 4px;
      border-radius: 50%;
      background: #fff;
      opacity: 0.7;
      animation: twinkle 3s ease-in-out infinite;
    }
    @keyframes twinkle { 0%,100% { opacity: 0.25; } 50% { opacity: 0.9; } }
    .dunes {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      height: 130px;
      pointer-events: none;
      z-index: 0;
    }
    .dunes svg { width: 100%; height: 100%; display: block; }

    /* ── header ── */
    .app-header {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 26px 16px 10px;
    }
    .app-header h1 {
      font-family: 'Yatra One', cursive;
      font-size: 2.7rem;
      letter-spacing: 6px;
      color: var(--cream);
      text-shadow: 0 3px 0 rgba(80,20,60,0.55), 0 8px 24px rgba(0,0,0,0.45);
    }
    .app-header .subtitle {
      color: var(--gold);
      letter-spacing: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 2px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.5);
    }

    /* ── screens ── */
    .screen {
      display: none;
      width: 100%;
      max-width: 560px;
      padding: 14px 16px 160px;
      position: relative;
      z-index: 1;
    }
    .screen.active { display: block; }

    /* ── shared card panel ── */
    .panel {
      background: var(--cream);
      border-radius: 22px;
      border: 3px solid rgba(60,20,50,0.25);
      box-shadow: 0 14px 40px rgba(20,5,35,0.45), inset 0 2px 0 rgba(255,255,255,0.7);
      padding: 24px 20px;
    }
    .panel h2 {
      font-family: 'Yatra One', cursive;
      font-weight: 400;
      text-align: center;
      font-size: 1.35rem;
      color: var(--dusk);
      margin-bottom: 18px;
    }

    /* ── buttons ── */
    .btn {
      border: none;
      border-radius: 14px;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1.05rem;
      cursor: pointer;
      padding: 14px 18px;
      transition: transform 0.1s, filter 0.15s;
      letter-spacing: 0.5px;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: linear-gradient(135deg, var(--coral), var(--sunset));
      color: #fff;
      box-shadow: 0 5px 0 #a93a30, 0 8px 18px rgba(0,0,0,0.3);
      text-shadow: 0 1px 2px rgba(0,0,0,0.25);
    }
    .btn-primary:hover { filter: brightness(1.07); }
    .btn-ghost {
      background: transparent;
      color: var(--dusk);
      border: 2.5px solid var(--dusk);
      box-shadow: none;
    }
    .btn-ghost:hover { background: rgba(69,32,110,0.08); }
    .btn-row { display: flex; gap: 12px; margin-top: 20px; }
    .btn-row .btn { flex: 1; }

    /* ── setup ── */
    .player-count-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 22px;
    }
    .count-btn {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: none;
      background: var(--teal);
      color: #fff;
      font-size: 1.5rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--teal-deep);
      transition: transform 0.1s;
    }
    .count-btn:active { transform: scale(0.94); }
    .count-display {
      font-family: 'Yatra One', cursive;
      font-size: 2rem;
      color: var(--coral);
      min-width: 44px;
      text-align: center;
    }
    .player-inputs { display: flex; flex-direction: column; gap: 10px; }
    .player-input-row { display: flex; align-items: center; gap: 10px; }
    .player-color-dot {
      width: 22px; height: 22px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 2.5px solid rgba(0,0,0,0.2);
      box-shadow: inset 0 -3px 5px rgba(0,0,0,0.25);
    }
    .player-inputs input {
      flex: 1;
      padding: 12px 16px;
      border: 2.5px solid var(--cream-dark);
      border-radius: 12px;
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      background: #fff;
      color: var(--ink);
      outline: none;
      transition: border-color 0.15s;
    }
    .player-inputs input:focus { border-color: var(--sunset); }

    /* ── wizard ── */
    .progress-track {
      display: flex;
      justify-content: center;
      gap: 7px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .progress-dot {
      width: 34px; height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.75);
      background: rgba(255,255,255,0.16);
      border: 2px solid rgba(255,255,255,0.3);
      transition: all 0.2s;
      cursor: pointer;
    }
    .progress-dot.done {
      background: var(--gold);
      color: var(--ink);
      border-color: #fff;
    }
    .progress-dot.current {
      background: #fff;
      color: var(--coral);
      border-color: #fff;
      transform: scale(1.2);
      box-shadow: 0 0 16px rgba(255,255,255,0.8);
    }

    /* the big "game card" */
    .game-card {
      background: var(--cream);
      border-radius: 22px;
      border: 3px solid rgba(60,20,50,0.3);
      box-shadow: 0 16px 44px rgba(20,5,35,0.5), inset 0 2px 0 rgba(255,255,255,0.7);
      overflow: hidden;
    }
    .game-card-banner {
      position: relative;
      padding: 18px 20px 20px;
      text-align: center;
      color: #fff;
      overflow: hidden;
    }
    .game-card-banner::after {
      content: '';
      position: absolute;
      left: 0; right: 0; bottom: -1px;
      height: 14px;
      background: var(--cream);
      border-radius: 100% 100% 0 0 / 200% 200% 0 0;
    }
    .banner-sun {
      position: absolute;
      left: 50%; top: -46px;
      transform: translateX(-50%);
      width: 150px; height: 150px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.35), transparent 65%);
      pointer-events: none;
    }
    .game-card-banner .step-kicker {
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0.85;
    }
    .game-card-banner .step-number {
      font-family: 'Yatra One', cursive;
      font-size: 3.2rem;
      line-height: 1.1;
      text-shadow: 0 3px 0 rgba(0,0,0,0.28), 0 6px 16px rgba(0,0,0,0.3);
    }
    .game-card-banner .step-hint {
      font-size: 0.82rem;
      font-weight: 600;
      opacity: 0.92;
      margin-top: 2px;
    }
    .game-card-body { padding: 16px 16px 20px; }

    /* player score rows in wizard */
    .wizard-player {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 14px;
      background: #fff;
      border: 2px solid var(--cream-dark);
      margin-bottom: 9px;
    }
    .wizard-player:last-child { margin-bottom: 0; }
    .wizard-player .player-color-dot { width: 18px; height: 18px; }
    .wizard-player .wp-name {
      flex: 1;
      font-weight: 700;
      font-size: 0.98rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .wizard-player .wp-total {
      font-size: 0.72rem;
      font-weight: 700;
      color: #9a8c78;
      margin-right: 2px;
      white-space: nowrap;
    }
    .stepper {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stepper button {
      width: 40px; height: 40px;
      border-radius: 10px;
      border: none;
      background: var(--teal);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 2.5px 0 var(--teal-deep);
      transition: transform 0.08s;
      line-height: 1;
    }
    .stepper button:active { transform: scale(0.92); }
    .stepper button.btn-step5 {
      background: var(--dusk);
      box-shadow: 0 2.5px 0 var(--night);
    }
    .stepper input {
      width: 50px;
      padding: 9px 4px;
      text-align: center;
      border: 2.5px solid var(--cream-dark);
      border-radius: 10px;
      font-family: 'Nunito', sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--ink);
      background: var(--cream);
      outline: none;
      -moz-appearance: textfield;
    }
    .stepper input::-webkit-inner-spin-button,
    .stepper input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .stepper input:focus { border-color: var(--sunset); background: #fff; }

    .wizard-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .btn-small {
      padding: 7px 13px;
      border-radius: 10px;
      border: 2px solid rgba(255,255,255,0.55);
      background: rgba(255,255,255,0.12);
      color: #fff;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 0.78rem;
      cursor: pointer;
      letter-spacing: 0.5px;
    }
    .btn-small:hover { background: rgba(255,255,255,0.24); }

    /* ── score pad (overview, styled like the original sheet) ── */
    .scorepad {
      background: var(--pad-gray);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(20,5,35,0.45);
      border: 3px solid rgba(60,20,50,0.3);
    }
    .scorepad table {
      width: 100%;
      border-collapse: collapse;
    }
    .scorepad th {
      background: #c7c4bf;
      padding: 8px 4px;
      font-size: 0.78rem;
      font-weight: 800;
      color: #4a4542;
      text-align: center;
    }
    .scorepad td {
      border: 1px dashed #b3afa8;
      padding: 6px 4px;
      text-align: center;
      font-weight: 700;
      font-size: 0.95rem;
      color: #3c3833;
      min-width: 40px;
    }
    .scorepad .pad-label {
      font-family: 'Yatra One', cursive;
      font-size: 1.05rem;
      color: #6e3b34;
      width: 44px;
    }
    .scorepad tr.pad-sanctuary td {
      background: #cfccc6;
    }
    .scorepad tr.pad-total td {
      background: var(--pad-red);
      color: #fff;
      border: none;
      padding: 10px 4px;
      font-size: 1.15rem;
      font-weight: 800;
    }
    .scorepad tr.pad-total .pad-label {
      color: #fff;
      font-size: 1.3rem;
    }
    .scorepad tr.pad-total .pad-cell-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      padding: 4px 8px;
      background: #f4f1ea;
      color: #3c3833;
      border-radius: 8px;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.25);
    }

    /* ── results ── */
    .podium {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 10px;
      margin: 6px 0 22px;
    }
    .podium-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .podium-name {
      font-weight: 800;
      font-size: 0.85rem;
      color: var(--cream);
      max-width: 90px;
      text-align: center;
      word-break: break-word;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }
    .podium-score {
      font-family: 'Yatra One', cursive;
      font-size: 1.5rem;
      color: var(--gold);
      text-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }
    .podium-block {
      width: 76px;
      border-radius: 10px 10px 0 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 8px;
      font-size: 1.5rem;
      border: 2.5px solid rgba(60,20,50,0.35);
      border-bottom: none;
      box-shadow: 0 -4px 14px rgba(0,0,0,0.25);
    }
    .podium-block.rank1 { background: linear-gradient(180deg,#ffe9a3,#f6c667); }
    .podium-block.rank2 { background: linear-gradient(180deg,#e8e8e8,#bfbfbf); }
    .podium-block.rank3 { background: linear-gradient(180deg,#e8b27d,#c98850); }

    .winner-banner {
      text-align: center;
      margin-bottom: 14px;
    }
    .winner-banner .wb-label {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 3px;
      color: var(--gold);
      text-transform: uppercase;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }
    .winner-banner .wb-name {
      font-family: 'Yatra One', cursive;
      font-size: 1.9rem;
      color: var(--cream);
      text-shadow: 0 3px 0 rgba(80,20,60,0.5), 0 6px 18px rgba(0,0,0,0.45);
    }

    /* ── shared bits for history & stats ── */
    .panel + .panel { margin-top: 14px; }
    .panel-note {
      text-align: center;
      font-size: 0.78rem;
      font-weight: 700;
      color: #8a7a80;
      margin: -10px 0 14px;
    }
    .empty-state {
      text-align: center;
      color: #7a6a72;
      font-weight: 600;
      font-size: 0.92rem;
      padding: 16px 6px;
      line-height: 1.55;
    }
    .btn-outline {
      padding: 11px 12px;
      border-radius: 12px;
      border: 2.5px solid var(--dusk);
      background: transparent;
      color: var(--dusk);
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .btn-outline:hover { background: rgba(69,32,110,0.08); }
    .btn-danger {
      padding: 7px 13px;
      border-radius: 10px;
      border: 2px solid var(--pad-red);
      background: transparent;
      color: var(--pad-red);
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .btn-danger:hover { background: rgba(217,79,61,0.1); }
    .section-title {
      font-family: 'Yatra One', cursive;
      font-size: 1rem;
      color: var(--dusk);
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 22px 0 10px;
    }
    .section-title::after {
      content: '';
      flex: 1;
      height: 2px;
      background: repeating-linear-gradient(90deg, var(--cream-dark) 0 6px, transparent 6px 12px);
    }

    /* ── history list ── */
    .hist-list { display: flex; flex-direction: column; gap: 10px; }
    .hist-item {
      border: 2.5px solid var(--cream-dark);
      border-radius: 14px;
      overflow: hidden;
      background: #fff;
    }
    .hist-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 12px;
      cursor: pointer;
    }
    .hist-head:hover { background: #fffaf0; }
    .hist-main { flex: 1; min-width: 0; }
    .hist-date {
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #9a8a90;
    }
    .hist-winner {
      font-weight: 800;
      font-size: 1rem;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }
    .hist-winner .hw-score { color: var(--magenta); }
    .hist-dots { display: flex; gap: 4px; margin-top: 5px; }
    .hist-dots span {
      width: 10px; height: 10px;
      border-radius: 50%;
      border: 1.5px solid rgba(0,0,0,0.18);
    }
    .hist-chev {
      color: var(--dusk);
      font-weight: 800;
      font-size: 1.3rem;
      flex-shrink: 0;
      transition: transform 0.15s;
    }
    .hist-body { display: none; padding: 0 10px 12px; }
    .hist-item.open .hist-body { display: block; }
    .hist-item.open .hist-chev { transform: rotate(90deg); }
    .hist-actions { display: flex; justify-content: flex-end; margin-top: 10px; }
    .io-row { display: flex; gap: 9px; }
    .io-row .btn-outline { flex: 1; }

    /* ── stats ── */
    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      justify-content: center;
      margin-bottom: 14px;
    }
    .chip {
      padding: 7px 14px;
      border-radius: 999px;
      border: 2.5px solid rgba(255,255,255,0.5);
      background: rgba(255,255,255,0.14);
      color: var(--cream);
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.78rem;
      cursor: pointer;
    }
    .chip.active {
      background: var(--cream);
      border-color: var(--cream);
      color: var(--dusk);
    }
    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
    .stat-tile {
      background: #fff;
      border: 2.5px solid var(--cream-dark);
      border-radius: 14px;
      padding: 11px 5px;
      text-align: center;
    }
    .stat-value {
      font-family: 'Yatra One', cursive;
      font-size: 1.45rem;
      color: var(--magenta);
      line-height: 1.15;
    }
    .stat-label {
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      color: #8a7a80;
      margin-top: 3px;
    }
    .stat-table { width: 100%; border-collapse: collapse; }
    .stat-table th {
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: #8a7a80;
      padding: 0 4px 7px;
      text-align: right;
      white-space: nowrap;
    }
    .stat-table th:first-child, .stat-table td:first-child { text-align: left; }
    .stat-table td {
      padding: 8px 4px;
      border-top: 1px dashed var(--cream-dark);
      font-weight: 700;
      font-size: 0.88rem;
      color: var(--ink);
      text-align: right;
      white-space: nowrap;
    }
    .st-name { display: flex; align-items: center; gap: 7px; font-weight: 800; }
    .st-name .dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 1.5px solid rgba(0,0,0,0.18);
    }
    .bar-row { display: flex; align-items: center; gap: 9px; margin-bottom: 7px; }
    .bar-key {
      width: 30px;
      flex-shrink: 0;
      font-family: 'Yatra One', cursive;
      font-size: 0.95rem;
      color: #6e3b34;
      text-align: center;
    }
    .bar-track {
      flex: 1;
      height: 17px;
      background: var(--cream-dark);
      border-radius: 9px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 9px;
      background: linear-gradient(90deg, var(--magenta), var(--sunset));
      min-width: 3px;
    }
    .bar-fill.sanctuary { background: linear-gradient(90deg, var(--teal-deep), var(--teal)); }
    .bar-value {
      width: 40px;
      flex-shrink: 0;
      text-align: right;
      font-weight: 800;
      font-size: 0.85rem;
      color: var(--ink);
    }
    .spark-row {

    @media (max-width: 420px) {
      .stat-grid { grid-template-columns: repeat(2, 1fr); }
      .spark-name { width: 70px; }

    @media (max-width: 420px) {

      .game-card-banner .step-number { font-size: 2.6rem; }
      .stepper button { width: 34px; height: 36px; font-size: 0.72rem; }
      .stepper input { width: 44px; font-size: 1rem; }
      .scorepad td { font-size: 0.85rem; min-width: 34px; }
    }
  </style>
</head>

<datalist id="known-players"></datalist>

<script>
  const PLAYER_COLORS = ['#e8595c','#2980b9','#27ae60','#b8860b','#8e44ad','#e67e22'];
  const MIN_PLAYERS = 2, MAX_PLAYERS = 6, ROUNDS = 8;

  // banner colors per step, echoing the colored card frames of the game
  const STEP_COLORS = {
    8: ['#b53471','#83275a'], 7: ['#2980b9','#1b5a85'], 6: ['#27ae60','#1a7a43'],
    5: ['#e67e22','#aa5a14'], 4: ['#8e44ad','#65307c'], 3: ['#16a085','#0e6b59'],
    2: ['#c0392b','#8a261c'], 1: ['#d35400','#9a3d00'], sanctuary: ['#1d8a8a','#11605f']
  };

  // scoring order as in the original game: card 8 first, down to card 1, then sanctuaries
  const STEPS = [8,7,6,5,4,3,2,1,'sanctuary'];

  let players = [];
  let scores = {};      // scores[playerIndex][stepKey] = number | ''
  let stepIndex = 0;
  let playerCount = 2;

  // ── stars in the sky ──
  (function makeStars(){
    const sky = document.getElementById('sky');
    for (let i = 0; i < 26; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      s.style.left = Math.random()*100 + '%';
      s.style.top = Math.random()*30 + '%';
      s.style.animationDelay = (Math.random()*3) + 's';
      s.style.transform = `scale(${0.5 + Math.random()})`;
      sky.appendChild(s);
    }
  })();

  // ── setup ──
  const countDisplay = document.getElementById('count-display');
  const playerInputs = document.getElementById('player-inputs');

  function renderPlayerInputs() {
    countDisplay.textContent = playerCount;
    const existing = Array.from(playerInputs.querySelectorAll('input')).map(i => i.value);
    playerInputs.innerHTML = '';
    for (let i = 0; i < playerCount; i++) {
      const row = document.createElement('div');
      row.className = 'player-input-row';
      const dot = document.createElement('div');
      dot.className = 'player-color-dot';
      dot.style.background = PLAYER_COLORS[i];
      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = `Spieler ${i+1}`;
      input.maxLength = 16;
      input.setAttribute('list', 'known-players');
      if (existing[i]) input.value = existing[i];
      else if (players[i]) input.value = players[i];
      row.append(dot, input);
      playerInputs.appendChild(row);
    }
  }

  document.getElementById('btn-minus').onclick = () => { if (playerCount > MIN_PLAYERS) { playerCount--; renderPlayerInputs(); } };
  document.getElementById('btn-plus').onclick  = () => { if (playerCount < MAX_PLAYERS) { playerCount++; renderPlayerInputs(); } };

  document.getElementById('btn-start').onclick = () => {
    const inputs = playerInputs.querySelectorAll('input');
    players = Array.from(inputs).map((el, i) => el.value.trim() || `Spieler ${i+1}`);
    scores = {};
    players.forEach((_, i) => scores[i] = {});
    stepIndex = 0;
    savedGameId = null;
    renderWizard();
    showScreen('screen-wizard');
  };

  // ── wizard ──
  function stepKey(s) { return s === 'sanctuary' ? 'sanctuary' : `r${s}`; }

  function renderWizard() {
    const step = STEPS[stepIndex];
    const key = stepKey(step);
    const [c1, c2] = STEP_COLORS[step];

    const banner = document.getElementById('wizard-banner');
    banner.style.background = `linear-gradient(150deg, ${c1}, ${c2})`;
    document.getElementById('step-title').textContent = step === 'sanctuary' ? '⛩ Heiligtümer' : `Karte ${step}`;
    document.getElementById('step-kicker').textContent = step === 'sanctuary' ? 'Zum Abschluss' : 'Gemeinsam werten';
    document.getElementById('step-hint').textContent = step === 'sanctuary'
      ? 'Jeder zählt die Punkte seiner Heiligtümer'
      : `Jeder Spieler wertet seine ${step}. Karte`;

    // progress dots
    const track = document.getElementById('progress-track');
    track.innerHTML = '';
    STEPS.forEach((s, i) => {
      const dot = document.createElement('div');
      dot.className = 'progress-dot' + (i < stepIndex ? ' done' : i === stepIndex ? ' current' : '');
      dot.textContent = s === 'sanctuary' ? '⛩' : s;
      dot.onclick = () => { commitInputs(); stepIndex = i; renderWizard(); };
      track.appendChild(dot);
    });

    // player rows
    const wrap = document.getElementById('wizard-players');
    wrap.innerHTML = '';
    players.forEach((name, pi) => {
      const row = document.createElement('div');
      row.className = 'wizard-player';

      const dot = document.createElement('div');
      dot.className = 'player-color-dot';
      dot.style.background = PLAYER_COLORS[pi];

      const nm = document.createElement('div');
      nm.className = 'wp-name';
      nm.textContent = name;

      const total = document.createElement('div');
      total.className = 'wp-total';
      total.textContent = `Σ ${getTotal(pi)}`;

      const stepper = document.createElement('div');
      stepper.className = 'stepper';
      const minus5 = document.createElement('button');
      minus5.textContent = '−5';
      minus5.className = 'btn-step5';
      const minus = document.createElement('button');
      minus.textContent = '−1';
      const input = document.createElement('input');
      input.type = 'number';
      input.inputMode = 'numeric';
      input.placeholder = '0';
      input.dataset.player = pi;
      const saved = scores[pi][key];
      if (saved !== undefined && saved !== '') input.value = saved;
      const plus = document.createElement('button');
      plus.textContent = '+1';
      const plus5 = document.createElement('button');
      plus5.textContent = '+5';
      plus5.className = 'btn-step5';

      const bump = (d) => {
        const v = (parseInt(input.value, 10) || 0) + d;
        input.value = v;
        scores[pi][key] = v;
        total.textContent = `Σ ${getTotal(pi)}`;
      };
      minus5.onclick = () => bump(-5);
      minus.onclick = () => bump(-1);
      plus.onclick = () => bump(1);
      plus5.onclick = () => bump(5);
      input.oninput = () => {
        const v = input.value.trim();
        scores[pi][key] = v === '' ? '' : (parseInt(v, 10) || 0);
        total.textContent = `Σ ${getTotal(pi)}`;
      };
      input.onkeydown = (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const all = Array.from(document.querySelectorAll('#wizard-players input'));
          const i = all.indexOf(input);
          if (i < all.length - 1) all[i+1].focus(); else document.getElementById('btn-next').focus();
        }
      };

      stepper.append(minus5, minus, input, plus, plus5);
      row.append(dot, nm, total, stepper);
      wrap.appendChild(row);
    });

    document.getElementById('btn-prev').style.visibility = stepIndex === 0 ? 'hidden' : 'visible';
    document.getElementById('btn-next').textContent = stepIndex === STEPS.length - 1 ? 'Ergebnis 🏆' : 'Weiter →';
  }

  function commitInputs() {
    const key = stepKey(STEPS[stepIndex]);
    document.querySelectorAll('#wizard-players input').forEach(input => {
      const pi = +input.dataset.player;
      const v = input.value.trim();
      scores[pi][key] = v === '' ? '' : (parseInt(v, 10) || 0);
    });
  }

  document.getElementById('btn-prev').onclick = () => {
    commitInputs();
    if (stepIndex > 0) { stepIndex--; renderWizard(); }
  };
  document.getElementById('btn-next').onclick = () => {
    commitInputs();
    if (stepIndex < STEPS.length - 1) { stepIndex++; renderWizard(); }
    else showResults();
  };

  document.getElementById('btn-abort').onclick = () => {
    if (confirm('Neues Spiel starten? Alle Punkte gehen verloren.')) {
      playerCount = players.length || playerCount;
      renderPlayerInputs();
      showScreen('screen-setup');
    }
  };

  // ── overview ──
  document.getElementById('btn-overview').onclick = () => {
    commitInputs();
    document.getElementById('overview-pad').innerHTML = buildPadHtml(currentAsRecord());
    showScreen('screen-overview');
  };
  document.getElementById('btn-back-wizard').onclick = () => {
    renderWizard();
    showScreen('screen-wizard');
  };

  // ── totals & results ──
  function getTotal(pi) {
    let sum = 0;
    STEPS.forEach(s => {
      const v = scores[pi][stepKey(s)];
      if (v !== '' && v !== undefined) sum += Number(v);
    });
    return sum;
  }

  // renders any game record – the live one via currentAsRecord(), or a stored one
  function buildPadHtml(rec) {
    const empty = (v) => (v === '' || v === null || v === undefined) ? '·' : v;
    let html = '<table><thead><tr><th></th>';
    rec.players.forEach(p => {
      html += `<th><span style="color:${playerColor(p.colorIndex)}">●</span> ${escHtml(p.name)}</th>`;
    });
    html += '</tr></thead><tbody>';
    for (let r = 1; r <= ROUNDS; r++) {
      html += `<tr><td class="pad-label">${r}</td>`;
      rec.players.forEach(p => { html += `<td>${empty(p.rounds[`r${r}`])}</td>`; });
      html += '</tr>';
    }
    html += '<tr class="pad-sanctuary"><td class="pad-label">⛩</td>';
    rec.players.forEach(p => { html += `<td>${empty(p.sanctuary)}</td>`; });
    html += '</tr>';
    html += '<tr class="pad-total"><td class="pad-label">T</td>';
    rec.players.forEach(p => {
      html += `<td><span class="pad-cell-box">${p.total}</span></td>`;
    });
    html += '</tr></tbody></table>';
    return html;
  }

  function showResults() {
    const ranked = currentAsRecord().players.slice().sort((a, b) => b.total - a.total);
    updateSaveButton();

    const winners = ranked.filter(p => p.rank === 1).map(p => p.name);
    document.getElementById('winner-name').textContent = winners.join(' & ');

    // podium: 2nd, 1st, 3rd
    const top3 = ranked.slice(0, 3);
    const order = top3.length === 1 ? [top3[0]] : top3.length === 2 ? [top3[1], top3[0]] : [top3[1], top3[0], top3[2]];
    const medals = ['🥇','🥈','🥉'];
    const podium = document.getElementById('podium');
    podium.innerHTML = '';
    const allTotals = ranked.map(p => p.total);
    const maxTotal = Math.max(...allTotals);
    const minTotal = Math.min(...allTotals);
    const H_MAX = 120, H_MIN = 44;
    const blockHeight = (total) => {
      if (maxTotal === minTotal) return 80;
      return Math.round(H_MIN + ((total - minTotal) / (maxTotal - minTotal)) * (H_MAX - H_MIN));
    };
    order.forEach(p => {
      const item = document.createElement('div');
      item.className = 'podium-item';
      const h = blockHeight(p.total);
      item.innerHTML = `
        <div class="podium-name">${escHtml(p.name)}</div>
        <div class="podium-score">${p.total}</div>
        <div class="podium-block rank${Math.min(p.rank,3)}" style="height:${h}px">${p.rank <= 3 ? medals[p.rank-1] : p.rank + '.'}</div>`;
      podium.appendChild(item);
    });

    document.getElementById('results-pad').innerHTML = buildPadHtml(currentAsRecord());
    showScreen('screen-results');
  }

  document.getElementById('btn-edit-scores').onclick = () => {
    stepIndex = 0;
    renderWizard();
    showScreen('screen-wizard');
  };
  document.getElementById('btn-new-game').onclick = () => {
    playerCount = players.length || playerCount;
    renderPlayerInputs();
    showScreen('screen-setup');
  };

  // ── helpers ──
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    window.scrollTo(0, 0);
  }
  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── game database (localStorage) ──────────────────────────────
  // Everything goes through `store`, so swapping in a hosted backend later
  // only means reimplementing these five methods.
  const LS_KEY = 'faraway.games.v1';
  const DB_VERSION = 1;

  const store = {
    read() {
      try {
        const raw = localStorage.getItem(LS_KEY);
        if (!raw) return emptyDb();
        const db = JSON.parse(raw);
        if (!db || !Array.isArray(db.games)) return emptyDb();
        return migrate(db);
      } catch { return emptyDb(); }
    },
    write(db) {
      try {
        localStorage.setItem(LS_KEY, JSON.stringify(db));
        return true;
      } catch {
        alert('Die Historie konnte nicht gespeichert werden – der Browser-Speicher ist voll.');
        return false;
      }
    },
    // newest first, always normalized so imported or older records stay usable
    all() {
      return this.read().games
        .map(normalizeGame)
        .sort((a, b) => (a.playedAt < b.playedAt ? 1 : a.playedAt > b.playedAt ? -1 : 0));
    },
    add(game) {
      const db = this.read();
      db.games.push(game);
      return this.write(db);
    },
    remove(id) {
      const db = this.read();
      db.games = db.games.filter(g => g.id !== id);
      this.write(db);
    },
    replaceAll(games) {
      return this.write({ version: DB_VERSION, games });
    }
  };

  function emptyDb() { return { version: DB_VERSION, games: [] }; }

  // schema changes hook in here; v1 needs no transformation yet
  function migrate(db) {
    db.version = DB_VERSION;
    return db;
  }

  // players are matched across games by their normalized name
  function normKey(name) { return String(name || '').trim().toLowerCase().replace(/\s+/g, ' '); }

  function playerColor(i) { return PLAYER_COLORS[(i || 0) % PLAYER_COLORS.length]; }

  function assignRanks(list) {
    const sorted = list.slice().sort((a, b) => b.total - a.total);
    let rank = 1;
    sorted.forEach((p, i) => {
      p.rank = (i > 0 && p.total === sorted[i-1].total) ? sorted[i-1].rank : rank;
      rank++;
    });
    return sorted;
  }

  function sumPlayerRecord(p) {
    let s = 0;
    for (let r = 1; r <= ROUNDS; r++) s += Number((p.rounds && p.rounds[`r${r}`]) || 0);
    return s + Number(p.sanctuary || 0);
  }

  function normalizeGame(g) {
    const players = (g.players || []).map((p, i) => {
      const name = p.name || `Spieler ${i+1}`;
      return {
        name,
        key: p.key || normKey(name),
        colorIndex: typeof p.colorIndex === 'number' ? p.colorIndex : i,
        rounds: p.rounds || {},
        sanctuary: (p.sanctuary === undefined ? null : p.sanctuary),
        total: typeof p.total === 'number' ? p.total : sumPlayerRecord(p)
      };
    });
    assignRanks(players);
    return {
      id: g.id,
      playedAt: g.playedAt || '',
      playerCount: g.playerCount || players.length,
      players
    };
  }

  // ── converting the live wizard state into a stored record ─────
  function cellValue(pi, key) {
    const v = scores[pi][key];
    return (v === '' || v === undefined || v === null) ? null : Number(v);
  }

  function currentAsRecord() {
    const list = players.map((name, i) => {
      const rounds = {};
      for (let r = 1; r <= ROUNDS; r++) rounds[`r${r}`] = cellValue(i, `r${r}`);
      return {
        name,
        key: normKey(name),
        colorIndex: i,
        rounds,
        sanctuary: cellValue(i, 'sanctuary'),
        total: getTotal(i)
      };
    });
    assignRanks(list);
    return { playerCount: list.length, players: list };
  }

  function pad2(n) { return String(n).padStart(2, '0'); }

  function makeGameId(d) {
    const stamp = `${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}-${pad2(d.getHours())}${pad2(d.getMinutes())}`;
    return `${stamp}-${Math.random().toString(36).slice(2, 6)}`;
  }

  // local time with offset, so sorting stays chronological across timezones
  function isoLocal(d) {
    const off = -d.getTimezoneOffset();
    const sign = off >= 0 ? '+' : '-';
    return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}T` +
           `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}` +
           `${sign}${pad2(Math.floor(Math.abs(off)/60))}:${pad2(Math.abs(off)%60)}`;
  }

  function formatDate(iso) {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return iso || '—';
    return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' })
         + ' · ' + d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  }

  // ── saving the finished game ──────────────────────────────────
  let savedGameId = null;   // id of the current game once it is in the database

  function updateSaveButton() {
    const b = document.getElementById('btn-save-game');
    b.disabled = false;
    b.textContent = savedGameId ? '💾 Aktualisieren' : '💾 Spiel speichern';
  }

  function flashSaveButton(text) {
    const b = document.getElementById('btn-save-game');
    b.textContent = text;
    b.disabled = true;
    setTimeout(updateSaveButton, 1400);
  }

  document.getElementById('btn-save-game').onclick = () => {
    const rec = currentAsRecord();

    // already stored? overwrite it, so corrections do not create a duplicate
    if (savedGameId) {
      const db = store.read();
      const existing = db.games.find(g => g.id === savedGameId);
      if (existing) {
        Object.assign(existing, rec);
        if (store.write(db)) flashSaveButton('Aktualisiert ✓');
        return;
      }
      savedGameId = null;
    }

    const now = new Date();
    const game = Object.assign({ id: makeGameId(now), playedAt: isoLocal(now) }, rec);
    if (store.add(game)) {
      savedGameId = game.id;
      flashSaveButton('Gespeichert ✓');
      refreshHistoryAvailability();
    }
  };

  // ── history screen ────────────────────────────────────────────
  function renderHistory() {
    const games = store.all();
    const list = document.getElementById('hist-list');
    if (!games.length) {
      list.innerHTML = '<div class="empty-state">Noch keine Spiele gespeichert.<br>Beende eine Wertung und tippe dort auf „Spiel speichern“.</div>';
      return;
    }
    list.innerHTML = '';
    games.forEach(g => {
      const ranked = g.players.slice().sort((a, b) => b.total - a.total);
      const winners = ranked.filter(p => p.rank === 1).map(p => p.name).join(' & ');
      const dots = g.players.map(p => `<span style="background:${playerColor(p.colorIndex)}"></span>`).join('');

      const item = document.createElement('div');
      item.className = 'hist-item';
      item.innerHTML = `
        <div class="hist-head">
          <div class="hist-main">
            <div class="hist-date">${escHtml(formatDate(g.playedAt))} · ${g.playerCount} Spieler</div>
            <div class="hist-winner">🏆 ${escHtml(winners)} <span class="hw-score">${ranked[0].total}</span></div>
            <div class="hist-dots">${dots}</div>
          </div>
          <div class="hist-chev">›</div>
        </div>
        <div class="hist-body">
          <div class="scorepad">${buildPadHtml(g)}</div>
          <div class="hist-actions"><button class="btn-danger">🗑 Löschen</button></div>
        </div>`;

      item.querySelector('.hist-head').onclick = () => item.classList.toggle('open');
      item.querySelector('.btn-danger').onclick = () => {
        if (!confirm('Dieses Spiel aus der Historie löschen?')) return;
        store.remove(g.id);
        if (savedGameId === g.id) { savedGameId = null; updateSaveButton(); }
        renderHistory();
        refreshHistoryAvailability();
      };
      list.appendChild(item);
    });
  }

  function knownPlayerNames() {
    const seen = new Map();
    store.all().forEach(g => g.players.forEach(p => {
      if (!seen.has(p.key)) seen.set(p.key, p.name);
    }));
    return Array.from(seen.values()).sort((a, b) => a.localeCompare(b, 'de'));
  }

  // history button only makes sense once something is stored;
  // known names feed the setup autocomplete so typos stay rare
  function refreshHistoryAvailability() {
    const has = store.all().length > 0;
    document.getElementById('setup-history-row').style.display = has ? 'flex' : 'none';
    document.getElementById('known-players').innerHTML =
      knownPlayerNames().map(n => `<option value="${escHtml(n)}">`).join('');
  }

  // ── statistics ────────────────────────────────────────────────
  let statsFilter = 'all';

  function aggregate(games) {
    const map = new Map();
    games.forEach(g => g.players.forEach(p => {
      let a = map.get(p.key);
      if (!a) {
        a = { key: p.key, name: p.name, colorIndex: p.colorIndex, games: 0, wins: 0,
              sum: 0, best: -Infinity, worst: Infinity, rankSum: 0, results: [] };
        map.set(p.key, a);
      }
      a.games++;
      if (p.rank === 1) a.wins++;
      a.sum += p.total;
      a.best = Math.max(a.best, p.total);
      a.worst = Math.min(a.worst, p.total);
      a.rankSum += p.rank;
      a.results.push({ playedAt: g.playedAt, total: p.total, rank: p.rank });
    }));
    const list = Array.from(map.values());
    list.forEach(a => {
      a.avg = a.sum / a.games;
      a.avgRank = a.rankSum / a.games;
      a.winRate = a.wins / a.games;
      a.results.sort((x, y) => (x.playedAt < y.playedAt ? -1 : 1));   // oldest first
    });
    list.sort((a, b) => b.wins - a.wins || b.winRate - a.winRate || b.avg - a.avg);
    return list;
  }

  function renderStatsFilter(all) {
    const counts = Array.from(new Set(all.map(g => g.playerCount))).sort((a, b) => a - b);
    if (statsFilter !== 'all' && !counts.includes(Number(statsFilter))) statsFilter = 'all';
    const row = document.getElementById('stats-filter');
    row.innerHTML = '';
    [['all', 'Alle']].concat(counts.map(c => [String(c), `${c} Spieler`])).forEach(([val, label]) => {
      const b = document.createElement('button');
      b.className = 'chip' + (statsFilter === val ? ' active' : '');
      b.textContent = label;
      b.onclick = () => { statsFilter = val; renderStats(); };
      row.appendChild(b);
    });
  }

  function renderStats() {
    const all = store.all();
    renderStatsFilter(all);
    const games = statsFilter === 'all' ? all : all.filter(g => g.playerCount === Number(statsFilter));
    const el = document.getElementById('stats-content');
    if (!games.length) {
      el.innerHTML = '<div class="panel"><div class="empty-state">Für diese Auswahl gibt es noch keine Spiele.</div></div>';
      return;
    }
    const agg = aggregate(games);
    el.innerHTML = overviewTilesHtml(games, agg)
                 + playerTableHtml(agg)
                 + cardBarsHtml(games)
                 + trendHtml(agg)
                 + headToHeadHtml(games)
                 + recordsHtml(games, agg);
  }

  function shortName(n) { return n.length > 9 ? n.slice(0, 8) + '…' : n; }

  function overviewTilesHtml(games, agg) {
    const totals = games.flatMap(g => g.players.map(p => p.total));
    const avg = totals.reduce((a, b) => a + b, 0) / totals.length;
    const top = agg[0];
    const tiles = [
      [games.length, 'Spiele'],
      [agg.length, 'Spieler'],
      [Math.round(avg), 'Ø Punkte'],
      [Math.max(...totals), 'Höchstwert'],
      [Math.min(...totals), 'Tiefstwert'],
      [top ? top.wins : 0, top ? `Siege ${escHtml(shortName(top.name))}` : 'Siege']
    ];
    return `<div class="panel"><h2>Überblick</h2><div class="stat-grid">`
      + tiles.map(([v, l]) => `<div class="stat-tile"><div class="stat-value">${v}</div><div class="stat-label">${l}</div></div>`).join('')
      + `</div></div>`;
  }

  function playerTableHtml(agg) {
    const rows = agg.map(a => `
      <tr>
        <td><div class="st-name"><span class="dot" style="background:${playerColor(a.colorIndex)}"></span>${escHtml(a.name)}</div></td>
        <td>${a.games}</td>
        <td>${a.wins}</td>
        <td>${Math.round(a.winRate * 100)}%</td>
        <td>${a.avg.toFixed(1)}</td>
        <td>${a.best}</td>
        <td>${a.avgRank.toFixed(1)}</td>
      </tr>`).join('');
    return `<div class="panel"><h2>Spielerbilanz</h2><div style="overflow-x:auto">
      <table class="stat-table">
        <thead><tr><th>Spieler</th><th>Sp.</th><th>Siege</th><th>Quote</th><th>Ø</th><th>Best</th><th>Ø Platz</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div></div>`;
  }

  // average points scored on each card slot – only possible because the
  // wizard records every card separately
  function cardBarsHtml(games) {
    const keys = [];
    for (let r = ROUNDS; r >= 1; r--) keys.push(`r${r}`);
    keys.push('sanctuary');

    const acc = {};
    keys.forEach(k => acc[k] = { sum: 0, n: 0 });
    games.forEach(g => g.players.forEach(p => {
      keys.forEach(k => {
        const v = k === 'sanctuary' ? p.sanctuary : p.rounds[k];
        if (v === null || v === undefined) return;
        acc[k].sum += Number(v);
        acc[k].n++;
      });
    }));

    const avgOf = k => (acc[k].n ? acc[k].sum / acc[k].n : 0);
    const max = Math.max(1, ...keys.map(avgOf));
    const rows = keys.map(k => {
      const v = avgOf(k);
      return `<div class="bar-row">
        <div class="bar-key">${k === 'sanctuary' ? '⛩' : k.slice(1)}</div>
        <div class="bar-track"><div class="bar-fill${k === 'sanctuary' ? ' sanctuary' : ''}" style="width:${Math.max(2, (v / max) * 100).toFixed(1)}%"></div></div>
        <div class="bar-value">${v.toFixed(1)}</div>
      </div>`;
    }).join('');

    return `<div class="panel"><h2>Woher die Punkte kommen</h2>
      <div class="panel-note">Ø Punkte pro Karte, über alle Spieler</div>${rows}</div>`;
  }

  function trendHtml(agg) {
    const shown = agg.filter(a => a.results.length >= 2).slice(0, 6);
    if (!shown.length) return '';
    const rows = shown.map(a => {
      const vals = a.results.map(r => r.total);
      return `<div class="spark-row">
        <div class="spark-name"><span class="dot" style="background:${playerColor(a.colorIndex)}"></span><b>${escHtml(a.name)}</b></div>
        ${sparkSvg(vals, playerColor(a.colorIndex))}
        <div class="spark-last">${vals[vals.length - 1]}</div>
      </div>`;
    }).join('');
    return `<div class="panel"><h2>Punkteverlauf</h2>
      <div class="panel-note">älteste Partie links, neueste rechts</div>${rows}</div>`;
  }

  // hand-rolled sparkline – the tool deliberately has no chart dependency
  function sparkSvg(values, color) {
    const w = 100, h = 30, pad = 3;
    const max = Math.max(...values), min = Math.min(...values);
    const span = (max - min) || 1;
    const step = values.length > 1 ? (w - pad * 2) / (values.length - 1) : 0;
    const pts = values.map((v, i) => [
      pad + i * step,
      pad + (1 - (v - min) / span) * (h - pad * 2)
    ]);
    const line = pts.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
    const area = `${pad},${h - pad} ${line} ${(pad + (values.length - 1) * step).toFixed(1)},${h - pad}`;
    return `<svg class="spark-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
      <polygon points="${area}" fill="${color}" opacity="0.16"/>
      <polyline points="${line}" fill="none" stroke="${color}" stroke-width="2"
        vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>`;
  }

  function headToHeadHtml(games) {
    const pairs = new Map();
    games.forEach(g => {
      const ps = g.players;
      for (let i = 0; i < ps.length; i++) {
        for (let j = i + 1; j < ps.length; j++) {
          // order the pair by key so the same duo always lands in one bucket
          const [first, second] = ps[i].key <= ps[j].key ? [ps[i], ps[j]] : [ps[j], ps[i]];
          const id = `${first.key}|${second.key}`;
          let rec = pairs.get(id);
          if (!rec) {
            rec = { aName: first.name, bName: second.name, aWins: 0, bWins: 0, draws: 0, n: 0 };
            pairs.set(id, rec);
          }
          rec.n++;
          if (first.total > second.total) rec.aWins++;
          else if (second.total > first.total) rec.bWins++;
          else rec.draws++;
        }
      }
    });

    const list = Array.from(pairs.values()).filter(p => p.n >= 2).sort((a, b) => b.n - a.n).slice(0, 8);
    if (!list.length) return '';
    const rows = list.map(p => {
      const tie = p.draws ? ` title="${p.draws}× punktgleich"` : '';
      return `<div class="h2h-row"${tie}>
        <div class="h2h-side">${escHtml(p.aName)}</div>
        <div class="h2h-score">${p.aWins} : ${p.bWins}</div>
        <div class="h2h-side right">${escHtml(p.bName)}</div>
      </div>`;
    }).join('');
    return `<div class="panel"><h2>Direkte Duelle</h2>
      <div class="panel-note">wer im selben Spiel mehr Punkte hatte</div>${rows}</div>`;
  }

  function recordsHtml(games, agg) {
    let bestGame = null, bestCard = null;
    games.forEach(g => g.players.forEach(p => {
      if (!bestGame || p.total > bestGame.total) bestGame = { name: p.name, total: p.total };
      for (let r = ROUNDS; r >= 1; r--) {
        const v = p.rounds[`r${r}`];
        if (v === null || v === undefined) continue;
        if (!bestCard || Number(v) > bestCard.value) bestCard = { name: p.name, value: Number(v), card: r };
      }
    }));

    let streak = null;
    agg.forEach(a => {
      let cur = 0, max = 0;
      a.results.forEach(r => { cur = r.rank === 1 ? cur + 1 : 0; if (cur > max) max = cur; });
      if (max >= 2 && (!streak || max > streak.len)) streak = { name: a.name, len: max };
    });

    const rows = [];
    if (bestGame) rows.push(['Höchste Wertung', `<b>${bestGame.total}</b> · ${escHtml(bestGame.name)}`]);
    if (bestCard) rows.push(['Beste Einzelkarte', `<b>${bestCard.value}</b> · ${escHtml(bestCard.name)} (Karte ${bestCard.card})`]);
    if (streak) rows.push(['Längste Siegesserie', `<b>${streak.len}</b> · ${escHtml(streak.name)}`]);
    if (!rows.length) return '';

    return `<div class="panel"><h2>Rekorde</h2>`
      + rows.map(([l, v]) => `<div class="rec-row"><div class="rec-label">${l}</div><div class="rec-val">${v}</div></div>`).join('')
      + `</div>`;
  }

  // ── export / import ───────────────────────────────────────────
  document.getElementById('btn-export').onclick = () => {
    const blob = new Blob([JSON.stringify(store.read(), null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `faraway-historie-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };

  document.getElementById('btn-import').onclick = () => document.getElementById('import-file').click();

  document.getElementById('import-file').onchange = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const incoming = JSON.parse(reader.result);
        const games = Array.isArray(incoming) ? incoming : (incoming && incoming.games);
        if (!Array.isArray(games)) throw new Error('unbekanntes Format');

        // merge by id, existing games win – importing twice changes nothing
        const merged = new Map(store.read().games.map(g => [g.id, g]));
        let added = 0;
        games.forEach(g => {
          if (!g || !g.id || merged.has(g.id)) return;
          merged.set(g.id, normalizeGame(g));
          added++;
        });
        store.replaceAll(Array.from(merged.values()));
        renderHistory();
        refreshHistoryAvailability();
        alert(`${added} von ${games.length} Spielen importiert.` +
              (added < games.length ? `\n${games.length - added} waren bereits vorhanden.` : ''));
      } catch (err) {
        alert('Die Datei konnte nicht gelesen werden: ' + err.message);
      }
      e.target.value = '';
    };
    reader.readAsText(file);
  };

  // ── navigation for the new screens ────────────────────────────
  let historyReturnScreen = 'screen-setup';

  function openHistory(from) {
    historyReturnScreen = from;
    renderHistory();
    showScreen('screen-history');
  }

  document.getElementById('btn-open-history').onclick    = () => openHistory('screen-setup');
  document.getElementById('btn-results-history').onclick = () => openHistory('screen-results');
  document.getElementById('btn-history-back').onclick    = () => showScreen(historyReturnScreen);
  document.getElementById('btn-goto-stats').onclick      = () => { renderStats(); showScreen('screen-stats'); };
  document.getElementById('btn-stats-back').onclick      = () => { renderHistory(); showScreen('screen-history'); };

  renderPlayerInputs();
  refreshHistoryAvailability();
</script>
</body>
</html>
